<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CWB Star App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-color: #0b0b0f;
            --card-bg: #15151e;
            --text-main: #ffffff;
            --text-muted: #8b8b9e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px; /* Отступ для нижнего меню */
        }
        h1, h2, h3 { margin-top: 0; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0,255,255,0.3); }
        
        /* Экраны */
        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточки */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* Главная: Баланс */
        .balance-block { text-align: center; padding: 30px 10px; border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0,255,255,0.1); }
        .balance-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 48px; font-weight: bold; margin: 10px 0; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.5); }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2a35; }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-size: 12px; color: var(--text-muted); }
        .income { color: #00ff00; }
        .expense { color: var(--neon-pink); }

        /* Магазин */
        .products-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .product-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border-left: 3px solid var(--neon-pink); }
        .product-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .product-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
        .buy-btn {
            background: transparent; color: var(--neon-pink); border: 1px solid var(--neon-pink);
            padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .buy-btn:active { background: var(--neon-pink); color: #fff; }

        /* Задания */
        .task-cat { margin-bottom: 20px; }
        .task-cat-title { font-size: 16px; color: var(--neon-pink); margin-bottom: 10px; border-bottom: 1px solid #2a2a35; padding-bottom: 5px; }
        .task-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; }
        .task-name { flex: 1; padding-right: 10px; }
        .task-price { font-weight: bold; color: #ffd700; white-space: nowrap; }

        /* Опрос */
        .survey-input {
            width: 100%; background: #0a0a0f; border: 1px solid #2a2a35; color: #fff;
            padding: 12px; border-radius: 8px; margin-top: 8px; margin-bottom: 20px; outline: none;
        }
        .survey-input:focus { border-color: var(--neon-blue); }
        .btn-primary {
            background: var(--neon-blue); color: #000; border: none; padding: 12px; width: 100%;
            border-radius: 8px; font-weight: bold; font-size: 16px; text-transform: uppercase;
        }

        /* Нижнее меню навигации */
        .tab-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0d0d12; border-top: 1px solid #2a2a35;
            display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 100;
        }
        .tab { text-align: center; color: var(--text-muted); font-size: 12px; flex: 1; cursor: pointer; transition: 0.2s; }
        .tab.active { color: var(--neon-blue); text-shadow: 0 0 8px rgba(0,255,255,0.5); }
        .tab-icon { font-size: 20px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="home" class="screen active">
        <div class="card balance-block">
            <div class="balance-title">Твой баланс</div>
            <div class="balance-amount" id="user-balance">-- ⭐️</div>
            <div style="font-size: 18px; font-weight: bold;" id="user-name">Загрузка...</div>
        </div>
        
        <h3>История операций</h3>
        <div class="card" id="history-container">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Загрузка истории...</div>
            <!-- Сюда подгрузится история с сервера -->
        </div>
    </div>

    <!-- ЭКРАН 2: МАГАЗИН -->
    <div id="store" class="screen">
        <h2>Магазин</h2>
        <div class="products-grid" id="products-container">
            <!-- Сюда подгрузятся товары -->
        </div>
    </div>

    <!-- ЭКРАН 3: ЗАДАНИЯ -->
    <div id="tasks" class="screen">
        <h2>Задания</h2>
        <div id="tasks-container">
            <!-- Сюда подгрузятся задания -->
        </div>
    </div>

    <!-- ЭКРАН 4: ОПРОС -->
    <div id="survey" class="screen">
        <h2>Опрос</h2>
        <div class="card" id="survey-form">
            <p style="color: var(--text-muted); margin-bottom: 20px;">Пройди опрос и получи 1 ⭐️ на свой счет!</p>
            
            <label>Какой товар кажется самым привлекательным?</label>
            <input type="text" id="q1" class="survey-input" placeholder="Твой ответ...">
            
            <label>Какой товар ты бы убрал?</label>
            <input type="text" id="q2" class="survey-input" placeholder="Твой ответ...">
            
            <label>Какие товары ты бы добавил?</label>
            <input type="text" id="q3" class="survey-input" placeholder="Твой ответ...">
            
            <button class="btn-primary" onclick="submitSurvey()">Отправить (+1 ⭐️)</button>
        </div>
        <div id="survey-done" style="display: none; text-align: center; padding: 40px 0;">
            <div style="font-size: 40px; margin-bottom: 15px;">✅</div>
            <h3>Опрос пройден!</h3>
            <p style="color: var(--text-muted);">Спасибо за твои ответы.</p>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ (TAB BAR) -->
    <nav class="tab-bar">
        <div class="tab active" onclick="switchTab('home')">
            <span class="tab-icon">👤</span>Главная
        </div>
        <div class="tab" onclick="switchTab('store')">
            <span class="tab-icon">🛒</span>Магазин
        </div>
        <div class="tab" onclick="switchTab('tasks')">
            <span class="tab-icon">📋</span>Задания
        </div>
        <div class="tab" onclick="switchTab('survey')">
            <span class="tab-icon">📝</span>Опрос
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Справочник товаров
        const products = [
            { id: "item_1", name: "Чаша Северный Космобол", price: 5, desc: "Отличная чаша, идеальна для крепких забивок." },
            { id: "item_2", name: "Щипцы Муассель", price: 7, desc: "Удобные фирменные щипцы для работы с углем." },
            { id: "item_3", name: "Такси до работы (эконом)", price: 10, desc: "Оплатим твою поездку на смену на такси." },
            { id: "item_4", name: "Термостакан Муассель", price: 10, desc: "Стильный фирменный стакан." },
            { id: "item_8", name: "Энергетики HQD/Gorilla (12 шт)", price: 15, desc: "Месячный запас бодрости!" },
            { id: "item_10", name: "Рандом бокс", price: 25, desc: "Сюрприз-бокс с секретным наполнением." },
            { id: "item_18", name: "Кальян Alpha", price: 180, desc: "Модели на выбор: X, Enzo, ОСД, Gold, Биты." }
            // Я добавил часть товаров для примера, ты сможешь легко скопировать сюда остальные!
        ];

        // Справочник заданий
        const tasks = [
            { cat: "Продажи", items: [
                { name: "Выполнение плана", stars: 3 },
                { name: "Рекордная выручка за смену", stars: 40 },
                { name: "Выполнение плана (3 мес. подряд)", stars: 25 }
            ]},
            { cat: "Инициатива", items: [
                { name: "Выход на подмену", stars: 2 },
                { name: "Приведенный друг в компанию", stars: 15 }
            ]}
        ];

        // Переключение экранов
        function switchTab(tabId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Отрисовка магазина
        const prodCont = document.getElementById('products-container');
        products.forEach(p => {
            prodCont.innerHTML += `
                <div class="product-card">
                    <div class="product-title">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                        <span style="color: #ffd700; font-weight: bold; font-size: 18px;">${p.price} ⭐️</span>
                        <button class="buy-btn" onclick="buyItem('${p.id}')">Купить</button>
                    </div>
                </div>`;
        });

        // Отрисовка заданий
        const taskCont = document.getElementById('tasks-container');
        tasks.forEach(c => {
            let html = `<div class="task-cat"><div class="task-cat-title">${c.cat}</div>`;
            c.items.forEach(t => {
                html += `<div class="task-item"><div class="task-name">• ${t.name}</div><div class="task-price">+${t.stars} ⭐️</div></div>`;
            });
            html += `</div>`;
            taskCont.innerHTML += html;
        });

        // Фейковые данные для локального теста дизайна
        document.getElementById('user-name').innerText = "Вячеслав Киселев";
        document.getElementById('user-balance').innerText = "150 ⭐️";
        document.getElementById('history-container').innerHTML = `
            <div class="history-item">
                <div><div style="font-size: 14px;">Рекордная выручка</div><div class="history-date">29.09.2026 10:00</div></div>
                <div class="income">+40 ⭐️</div>
            </div>
            <div class="history-item">
                <div><div style="font-size: 14px;">Покупка: Щипцы</div><div class="history-date">28.09.2026 15:30</div></div>
                <div class="expense">-7 ⭐️</div>
            </div>
        `;

        function buyItem(id) {
            alert("В будущем здесь будет отправка запроса на покупку товара " + id);
        }

        function submitSurvey() {
            document.getElementById('survey-form').style.display = 'none';
            document.getElementById('survey-done').style.display = 'block';
            alert("Опрос отправлен!");
        }
    </script>
</body>
</html>
