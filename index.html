<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Звездный Магазин</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-color: #0d0d12;
            --card-bg: #1a1a24;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin-bottom: 25px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--neon-pink);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
            transition: transform 0.2s;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: var(--neon-blue);
        }
        .product-desc {
            font-size: 14px;
            color: #a0a0b0;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700; /* Золотой цвет для звезд */
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        .buy-btn {
            background: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.4);
        }
        .buy-btn:active {
            background: var(--neon-pink);
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>Звездный Магазин</h1>

    <div class="products-grid" id="products">
        <!-- Карточки товаров генерируются здесь скриптом -->
    </div>

    <script>
        // Инициализируем Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем на весь экран

        // Наш каталог товаров (для примера вывел первые 5)
        const products = [
            { id: "item_1", name: "Чаша Северный Космобол", price: 5, desc: "Отличная чаша, идеальна для крепких забивок." },
            { id: "item_2", name: "Щипцы Муассель", price: 7, desc: "Удобные фирменные щипцы для работы с углем." },
            { id: "item_3", name: "Такси до работы (эконом)", price: 10, desc: "Оплатим твою поездку на смену на такси." },
            { id: "item_4", name: "Термостакан Муассель", price: 10, desc: "Стильный фирменный стакан." },
            { id: "item_10", name: "Рандом бокс", price: 25, desc: "Сюрприз-бокс с секретным наполнением." }
        ];

        const productsContainer = document.getElementById('products');

        // Рисуем карточки на странице
        products.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-title">${item.name}</div>
                <div class="product-desc">${item.desc}</div>
                <div class="product-footer">
                    <div class="price">${item.price} ⭐️</div>
                    <button class="buy-btn" onclick="buyItem('${item.id}')">Купить</button>
                </div>
            `;
            productsContainer.appendChild(card);
        });

        // Функция покупки (отправляет данные обратно в бота)
        function buyItem(itemId) {
            // Отправляем ID товара в Python-код бота
            tg.sendData(itemId);
            // Закрываем окно Web App
            tg.close();
        }
    </script>
</body>
</html>
