<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CWB Star App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-color: #0b0b0f;
            --card-bg: #15151e;
            --text-main: #ffffff;
            --text-muted: #8b8b9e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 80px;
        }
        h1, h2, h3 { margin-top: 0; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0,255,255,0.3); }
        
        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .balance-block { text-align: center; padding: 30px 10px; border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0,255,255,0.1); }
        .balance-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 48px; font-weight: bold; margin: 10px 0; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.5); }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2a35; }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-size: 12px; color: var(--text-muted); }
        .income { color: #00ff00; }
        .expense { color: var(--neon-pink); }

        .products-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .product-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border-left: 3px solid var(--neon-pink); }
        .product-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .product-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
        .buy-btn {
            background: transparent; color: var(--neon-pink); border: 1px solid var(--neon-pink);
            padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .buy-btn:active { background: var(--neon-pink); color: #fff; }

        .task-cat { margin-bottom: 20px; }
        .task-cat-title { font-size: 15px; color: var(--neon-pink); margin-bottom: 10px; border-bottom: 1px solid #2a2a35; padding-bottom: 5px; }
        .task-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; }
        .task-name { flex: 1; padding-right: 10px; }
        .task-price { font-weight: bold; color: #ffd700; white-space: nowrap; }

        .survey-input {
            width: 100%; background: #0a0a0f; border: 1px solid #2a2a35; color: #fff;
            padding: 12px; border-radius: 8px; margin-top: 8px; margin-bottom: 20px; outline: none;
        }
        .survey-input:focus { border-color: var(--neon-blue); }
        .btn-primary {
            background: var(--neon-blue); color: #000; border: none; padding: 12px; width: 100%;
            border-radius: 8px; font-weight: bold; font-size: 16px; text-transform: uppercase; cursor: pointer;
        }

        .tab-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0d0d12; border-top: 1px solid #2a2a35;
            display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 100;
        }
        .tab { text-align: center; color: var(--text-muted); font-size: 12px; flex: 1; cursor: pointer; transition: 0.2s; }
        .tab.active { color: var(--neon-blue); text-shadow: 0 0 8px rgba(0,255,255,0.5); }
        .tab-icon { font-size: 20px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="home" class="screen active">
        <div class="card balance-block">
            <div class="balance-title">Сотрудник</div>
            <div class="balance-amount" id="user-balance">CWB Star</div>
            <div style="font-size: 16px; color: var(--text-muted);" id="user-name">Добро пожаловать!</div>
        </div>
        
        <div class="card" style="text-align: center; padding: 20px;">
            <p style="color: var(--text-muted); margin-bottom: 15px;">Выбирайте товары в Магазине и выполняйте Задания для получения звезд ⭐️</p>
            <button class="btn-primary" onclick="switchTab('store')">Перейти в магазин</button>
        </div>
    </div>

    <!-- ЭКРАН 2: МАГАЗИН -->
    <div id="store" class="screen">
        <h2>Магазин</h2>
        <div class="products-grid" id="products-container"></div>
    </div>

    <!-- ЭКРАН 3: ЗАДАНИЯ -->
    <div id="tasks" class="screen">
        <h2>Задания</h2>
        <div class="card" id="tasks-container"></div>
    </div>

    <!-- ЭКРАН 4: ОПРОС -->
    <div id="survey" class="screen">
        <h2>Опрос</h2>
        <div class="card" id="survey-form">
            <p style="color: var(--text-muted); margin-bottom: 20px;">Пройди опрос и получи 1 ⭐️ на свой счет!</p>
            
            <label>Какой товар кажется самым привлекательным?</label>
            <input type="text" id="q1" class="survey-input" placeholder="Твой ответ...">
            
            <label>Какой товар ты бы убрал?</label>
            <input type="text" id="q2" class="survey-input" placeholder="Твой ответ...">
            
            <label>Какие товары ты бы добавил?</label>
            <input type="text" id="q3" class="survey-input" placeholder="Твой ответ...">
            
            <button class="btn-primary" onclick="submitSurvey()">Отправить (+1 ⭐️)</button>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <nav class="tab-bar">
        <div class="tab active" onclick="switchTab('home')">
            <span class="tab-icon">👤</span>Главная
        </div>
        <div class="tab" onclick="switchTab('store')">
            <span class="tab-icon">🛒</span>Магазин
        </div>
        <div class="tab" onclick="switchTab('tasks')">
            <span class="tab-icon">📋</span>Задания
        </div>
        <div class="tab" onclick="switchTab('survey')">
            <span class="tab-icon">📝</span>Опрос
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Показываем имя из профиля Telegram
        const userName = tg.initDataUnsafe?.user?.first_name || "Коллега";
        document.getElementById('user-name').innerText = userName;

        const products = [
            { id: "item_1", name: "Чаша Северный Космобол", price: 5, desc: "Отличная чаша, идеальна для крепких забивок." },
            { id: "item_2", name: "Щипцы Муассель", price: 7, desc: "Удобные фирменные щипцы для работы с углем." },
            { id: "item_3", name: "Такси до работы (эконом)", price: 10, desc: "Оплатим твою поездку на смену на такси." },
            { id: "item_4", name: "Термостакан Муассель", price: 10, desc: "Стильный фирменный стакан." },
            { id: "item_5", name: "Обнуление одного опоздания", price: 15, desc: "Прощаем одно опоздание до 15 минут." },
            { id: "item_6", name: "Термокружка Муассель", price: 15, desc: "Фирменная кружка, долго держит тепло." },
            { id: "item_7", name: "Обед на рабочем месте", price: 15, desc: "Доставка из KFC, BurgerKing или Вкусно и точка." },
            { id: "item_8", name: "Энергетики HQD/Gorilla (12 шт)", price: 15, desc: "Месячный запас бодрости!" },
            { id: "item_9", name: "Энергетики Monster (12 шт)", price: 25, desc: "Месячный запас крутого энергетика!" },
            { id: "item_10", name: "Рандом бокс", price: 25, desc: "Сюрприз-бокс с секретным наполнением." },
            { id: "item_11", name: "+15 тыс в личный план", price: 30, desc: "Помощь в выполнении личного плана продаж." },
            { id: "item_12", name: "Сертификат Золотое Яблоко", price: 40, desc: "Подарочный сертификат на 3000 рублей." },
            { id: "item_13", name: "Рюкзак Муассель", price: 45, desc: "Вместительный фирменный рюкзак." },
            { id: "item_14", name: "Кофта Муассель (размер S)", price: 55, desc: "Уютная фирменная кофта." },
            { id: "item_15", name: "Глэмпинг «Лесотерапия»", price: 65, desc: "Суточный отдых на двоих на природе." },
            { id: "item_16", name: "Премия 7 000 руб.", price: 90, desc: "Приятная денежная прибавка." },
            { id: "item_17", name: "Невыход на подмены (2 мес)", price: 100, desc: "Официальное освобождение от подмен." },
            { id: "item_18", name: "Кальян Alpha", price: 180, desc: "Модели на выбор: X, Enzo, ОСД, Gold, Биты." },
            { id: "item_19", name: "Премия 15 000 руб.", price: 200, desc: "Мощный денежный бонус!" },
            { id: "item_20", name: "Чаша Хука", price: 350, desc: "Эксклюзивный ценный приз!" }
        ];

        const tasks = [
            { cat: "1. Продажи", items: [
                { name: "Выполнение личного плана продаж на протяжении трех месяцев подряд", stars: 25 },
                { name: "Выполнение личного плана продаж на протяжении пяти месяцев подряд", stars: 25 },
                { name: "Рекордная выручка за смену", stars: 40 },
                { name: "Первое выполнение индивидуального плана продаж", stars: 5 },
                { name: "Продал больше всех акций в период проведения", stars: 10 },
                { name: "Выполнение плана продаж на 110 и более %", stars: 15 },
                { name: "Выполнение плана", stars: 3 },
                { name: "Продал больше всех единиц товара в период мотивации в своей категории", stars: 7 }
            ]},
            { cat: "2. Личное развитие", items: [
                { name: "Прохождение стажировки и сдача экзамена для начала работы продавцом", stars: 5 },
                { name: "Повышение до грейда “старший продавец”", stars: 15 },
                { name: "Повышение до грейда “эксперт”", stars: 25 },
                { name: "Успешное прохождение всех тренингов по продажам", stars: 10 }
            ]},
            { cat: "3. Качество", items: [
                { name: "Ревизия с расхождением до 1000 руб. на протяжении 2 месяцев подряд", stars: 7 },
                { name: "Успешная сдача стандартов по итогам двух проверок 32/32", stars: 5 },
                { name: "Успешное прохождение проверки тайным покупателем на максимальный балл", stars: 50 }
            ]},
            { cat: "4. Инициатива", items: [
                { name: "Организация досуга команды", stars: 5 },
                { name: "Организация и проведение обучения для сотрудников", stars: 10 },
                { name: "Приведенный друг в компанию, который отработал 3 месяца", stars: 15 },
                { name: "Наставничество новых сотрудников на протяжении месяца с конкретными результатами", stars: 10 },
                { name: "Выход на подмену", stars: 2 },
                { name: "Выход на экстренную подмену (уведомление за сутки и меньше до смены)", stars: 5 }
            ]}
        ];

        function switchTab(tabId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const prodCont = document.getElementById('products-container');
        products.forEach(p => {
            prodCont.innerHTML += `
                <div class="product-card">
                    <div class="product-title">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                        <span style="color: #ffd700; font-weight: bold; font-size: 18px;">${p.price} ⭐️</span>
                        <button class="buy-btn" onclick="buyItem('${p.id}')">Купить</button>
                    </div>
                </div>`;
        });

        const taskCont = document.getElementById('tasks-container');
        tasks.forEach(c => {
            let html = `<div class="task-cat"><div class="task-cat-title">${c.cat}</div>`;
            c.items.forEach(t => {
                html += `<div class="task-item"><div class="task-name">• ${t.name}</div><div class="task-price">+${t.stars} ⭐️</div></div>`;
            });
            html += `</div>`;
            taskCont.innerHTML += html;
        });

        function buyItem(itemId) {
            if (confirm("Отправить заявку на покупку этого товара?")) {
                tg.sendData(itemId); // Мгновенно передает товар в бота и закрывает приложение
            }
        }

        function submitSurvey() {
            let q1 = document.getElementById('q1').value.trim();
            let q2 = document.getElementById('q2').value.trim();
            let q3 = document.getElementById('q3').value.trim();

            if (!q1 || !q2 || !q3) {
                alert("Пожалуйста, ответьте на все вопросы!");
                return;
            }

            tg.sendData(`survey|${q1}|${q2}|${q3}`); // Передает опрос в бота
        }
    </script>
</body>
</html>
